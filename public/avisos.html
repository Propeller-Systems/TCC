<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avisos e notícias</title>
    <link href="style/style.css" rel="stylesheet" />
    <link href="style/avisos.css" rel="stylesheet" />
  </head>
  <body class="with-sidebar">
    <div id="sidebar-placeholder"></div>
    <main id="main-content">
      <div class="p-4">
        <div>
          <h1>Avisos e Notícias</h1>
          <p>Informe os funcionários sobre novidades, eventos e atualizações importantes.</p>
          <button
            type="button"
            id="btnAviso"
            class="btn btn-dark"
            onclick="abrirModal()"
          >
            + Criar Notícia
          </button>
        </div>

        <hr>

        <ul id="avisosList"></ul>
      </div>
    </main>

    <script src="js/script.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/noticias.js" defer></script>
  </body>
</html>
